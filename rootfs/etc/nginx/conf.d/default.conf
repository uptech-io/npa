server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;
    # Instantly rejects the TLS handshake and aborts the connection.
    ssl_reject_handshake on;
    return 421;
}

server {
	listen 80 default_server;
	listen [::]:80 default_server;

	server_name _;
	access_log /dev/null;

    include /etc/nginx/conf.d/include/acme-challenge.conf;

	location / {
		return 301 https://$host$request_uri;
	}
}
