# NPM's "proxy" format is left out for now: it reads $server, and nginx refuses to start when no "set $server" exists.
log_format standard '[$time_local] $status - $request_method $scheme $host "$request_uri" [Client $remote_addr] [Length $body_bytes_sent] [Gzip $gzip_ratio] "$http_user_agent" "$http_referer"';

access_log /data/log/nginx/fallback_http_access.log standard;
