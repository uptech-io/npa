server {
	listen 443 ssl;
	listen [::]:443 ssl;

    server_name portainer.uptech.com.br;

    access_log /data/log/nginx/portainer_access.log standard;

    acme_certificate letsencrypt; 

    ssl_certificate $acme_certificate; 
    ssl_certificate_key $acme_certificate_key;
    ssl_certificate_cache max=2; 

    include /etc/nginx/conf.d/include/ssl.conf;

    location / {
        set $forward_scheme "http";
        set $server "portainer.uptech.local";
        set $port "9000";

		proxy_http_version 1.1;
		proxy_set_header Upgrade $upgrade_websocket;
		proxy_set_header Connection $connection_upgrade;

		proxy_send_timeout	10m;
		proxy_read_timeout	10m;

        include /etc/nginx/conf.d/include/proxy-header.conf;
        proxy_pass $forward_scheme://$server:$port$request_uri;
    }
}
